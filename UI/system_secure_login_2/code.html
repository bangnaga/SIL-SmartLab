<div class="space-y-1.5">

<span class="material-icons-round text-xl">visibility_off</span>
</button>
</div>
</div>

<button class="w-12 h-12 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 active:bg-emerald-50 active:text-[var(--primary-color)] transition-all flex items-center justify-center">

<div class="flex items-center justify-center gap-4 text-slate-400 dark:text-slate-600">

<span class="w-1 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></span>
<span class="text-[10px] font-700 tracking-widest uppercase">v4.2.0-aman</span>
