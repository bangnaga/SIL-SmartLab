<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Halaman Login Sistem</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">
<div class="h-12 w-full"></div>
<main class="flex-1 flex flex-col items-center justify-center px-6 pb-12">
<div class="w-full max-w-sm mb-10 text-center">
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary/10 dark:bg-primary/20 rounded-2xl mb-6">
<span class="material-icons-round text-primary text-5xl">biotech</span>
</div>
<h1 class="text-3xl font-800 tracking-tight text-slate-900 dark:text-white mb-2">Sistem Manajemen</h1>
<p class="text-slate-500 dark:text-slate-400 font-medium">Laboratorium Medis</p>
</div>
<div class="w-full max-w-sm bg-white dark:bg-slate-900/50 p-8 rounded-xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800">
<div class="mb-8">
<h2 class="text-xl font-700 mb-6 text-center">Masuk ke akun Anda</h2>
<div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-lg mb-8">
<button class="flex-1 py-2 text-[10px] font-700 rounded-md bg-white dark:bg-slate-700 shadow-sm text-primary transition-all">
                        ADMIN
                    </button>
<button class="flex-1 py-2 text-[10px] font-600 rounded-md text-slate-500 dark:text-slate-400 hover:text-primary transition-all">
                        DOSEN
                    </button>
<button class="flex-1 py-2 text-[10px] font-600 rounded-md text-slate-500 dark:text-slate-400 hover:text-primary transition-all">
                        MAHASISWA
                    </button>
</div>
<form class="space-y-5" onsubmit="return false;">
<div class="space-y-1.5">
<label class="text-xs font-700 text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Nama Pengguna</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-icons-round text-slate-400 text-xl group-focus-within:text-primary transition-colors">account_circle</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border-transparent focus:border-primary focus:ring-0 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 transition-all font-medium" placeholder="lab.admin.01" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center ml-1">
<label class="text-xs font-700 text-slate-500 dark:text-slate-400 uppercase tracking-wider">Kata Sandi</label>
<a class="text-xs font-700 text-primary hover:underline" href="#">Lupa?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-icons-round text-slate-400 text-xl group-focus-within:text-primary transition-colors">lock_open</span>
</div>
<input class="block w-full pl-11 pr-12 py-3.5 bg-slate-50 dark:bg-slate-800 border-transparent focus:border-primary focus:ring-0 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 transition-all font-medium" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-icons-round text-xl">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-700 py-4 rounded-lg shadow-lg shadow-primary/20 transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="submit">
<span>Masuk Aman</span>
<span class="material-icons-round text-lg">arrow_forward</span>
</button>
</form>
</div>
<div class="pt-6 border-t border-slate-100 dark:border-slate-800 flex flex-col items-center">
<p class="text-xs text-slate-400 font-medium mb-4">Atau masuk dengan</p>
<div class="flex gap-6">
<button class="p-3 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-primary/10 active:text-primary transition-all">
<span class="material-icons-round text-3xl">faceid</span>
</button>
<button class="p-3 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-primary/10 active:text-primary transition-all">
<span class="material-icons-round text-3xl">fingerprint</span>
</button>
</div>
</div>
</div>
<div class="mt-12 text-center space-y-4">
<div class="inline-flex items-center gap-2 px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/50 rounded-full">
<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
<span class="text-[10px] font-700 text-emerald-700 dark:text-emerald-400 uppercase tracking-widest leading-none">Sistem Online</span>
</div>
<div class="flex items-center justify-center gap-4 text-slate-400 dark:text-slate-600">
<span class="text-[11px] font-600 tracking-wide uppercase">Patuh HIPAA</span>
<span class="w-1 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></span>
<span class="text-[11px] font-600 tracking-wide uppercase">v4.2.0-aman</span>
</div>
</div>
</main>
<div class="h-8 w-full flex justify-center items-end pb-2">
<div class="w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
